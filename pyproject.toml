[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "etf-lite"
version = "0.1.0"
description = "轻量 A 股 ETF 数据 SDK：pandas 一行代码读取全市场 ETF 日行情"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["etf", "a-share", "china", "finance", "data", "quant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "pandas>=2.0",
    "pyarrow>=14.0",
    "requests>=2.28",
]

[project.urls]
Homepage = "https://github.com/your-github-name/etf-lite"
Source = "https://github.com/your-github-name/etf-lite"

[tool.setuptools.packages.find]
include = ["etf_lite*"]
